schema: spec-driven
context: |
  文档使用中文，保留 OpenSpec 结构标题及 SHALL/MUST 关键词。
  这是公开 Markdown 学习和设计复盘仓库，没有应用服务或构建产物。保留源码事实、历史决定、事后分析与待验证的区别。
  基线是源码或已有文档的事后补录，不证明历史已采用 SDD。
  功能、数据、安全边界变化须先确认；禁止把格式校验称为业务验收。
rules:
  proposal:
    - 说明目的、范围、基线版本、不修改的行为和验收标准。
  specs:
    - 每项需求提供可观察的正常、边界或失败场景，并关联实际证据。
  tasks:
    - 区分已执行、未执行、失败与外部环境待验证，不提前勾选。
